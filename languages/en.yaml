      MISSING_COUNT: "{n, plural, one{# image without thumbnail} other{# images without thumbnail}}"
      MISSING_HEAD: "{count}: the gallery serves the original instead, which makes loading heavier."
      MISSING_OVER: "{n, plural, one{# exceeds} other{# exceed}} the {mp} MP limit beyond which Grav refuses to resize an image ({setting})."
      MISSING_NOTE: "“Shrink” brings the image just under the system limit of {mp} MP, then creates its thumbnail. {warning}; captions and tags in .meta.yaml files are kept."
      MISSING_NOTE_WARNING: "The original is replaced permanently and its EXIF data is lost"
      MISSING_GEN_FAILED: "thumbnail generation failed"
      MISSING_TARGET: "After shrinking: {width} × {height}"
      MISSING_MORE: "{n, plural, one{… and # more.} other{… and # more.}}"
      SELECT_ALL: "Select all"
      SHRINK: "Shrink"
      SHRINK_SELECTION: "Shrink selection ({n})"
      SHRINK_DOING: "Shrinking…"
      SHRINK_FAILED: "Failed: {reason}"
