      SHRINK_CONFIRM_TITLE: "{n, plural, one{Shrink # image?} other{Shrink # images?}}"
      SHRINK_CONFIRM_TEXT: "Each image is brought just under {mp} MP. THE ORIGINAL IS REPLACED permanently, with no backup copy, and its EXIF data (camera, shooting date…) is lost. Captions and tags in .meta.yaml files are kept."
