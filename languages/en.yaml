      SHRINK_DONE_TEXT_FAILED: "{ok} of {total} shrunk, {failed} failed: see the reason on each line below."
      SHRINK_NO_THUMB: "image shrunk, but its thumbnail is still missing"
      SHRINK_ERR_FAILED: "failed"
      # Shrink refusals: SHRINK_ERR_<code returned by the server, upper-cased>.
      SHRINK_ERR_NO_LIMIT: "no pixel limit is configured"
      SHRINK_ERR_FILE_MISSING: "file not found"
      SHRINK_ERR_NOT_WRITABLE: "the web server is not allowed to modify this file"
      SHRINK_ERR_NO_GD: "the PHP GD extension is missing"
      SHRINK_ERR_UNREADABLE: "unreadable image"
      SHRINK_ERR_UNDER_LIMIT: "this image does not exceed the limit"
      SHRINK_ERR_UNSUPPORTED: "unsupported format (JPEG, PNG and WebP only)"
      SHRINK_ERR_DECODE_FAILED: "the image could not be decoded"
      SHRINK_ERR_WRITE_FAILED: "the shrunk image could not be written"
      SHRINK_ERR_REPLACE_FAILED: "the original could not be replaced"
      SHRINK_ERR_NOT_INDEXED: "image not in the index"
      SHRINK_ERR_HAS_THUMB: "this image already has a thumbnail"
      SHRINK_ERR_NO_ARTICLE: "article not found"
      # Uninstall field.
      UN_TITLE: "Delete the plugin data"
      UN_DESC: "To do just before uninstalling. Deletes the index and all thumbnails, which uninstalling leaves on the server; both can be recreated by a reindex. The plugin settings are kept. So are the visitor comments, unless you tick the box below: they are then {warning}, with no way to get them back."
      UN_DESC_WARNING: "deleted too, permanently"
      UN_WITH_COMMENTS: "Also delete visitor comments (irreversible)"
      UN_BUTTON: "Delete the data"
      UN_BUSY: "Deleting…"
      UN_CONFIRM_TITLE: "Delete the plugin data?"
      UN_CONFIRM_TEXT: "The gallery index and all thumbnails will be deleted: the gallery will be empty until a new reindex."
      UN_CONFIRM_KEEP: "Visitor comments are kept."
      UN_CONFIRM_COMMENTS: "VISITOR COMMENTS will be deleted too, PERMANENTLY: nothing can recreate them."
      UN_CONFIRM_BUTTON: "Delete index and thumbnails"
      UN_CONFIRM_BUTTON_ALL: "Delete everything, comments included"
      UN_INDEX_DELETED: "index deleted"
      UN_INDEX_ABSENT: "index already absent"
      UN_THUMBS: "{n, plural, one{# thumbnail deleted} other{# thumbnails deleted}}"
      UN_COMMENTS: "{n, plural, one{# comment deleted} other{# comments deleted}}"
      UN_FREED: "{size} freed"
      UN_DONE: "Data deleted"
      UN_DONE_HINT: "You can now uninstall the plugin. While it stays active, a visit to the gallery recreates an empty database."
      UN_FAILED: "Data deletion — failed"
      # Comment edit form: preview of the commented image.
      PREVIEW_UNAVAILABLE: "Preview unavailable."
      PREVIEW_LOADING: "Loading…"
      PREVIEW_NOT_FOUND: "Image not found."
      PREVIEW_OPEN: "Open the original image"

