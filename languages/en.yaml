# galinf plugin strings — English.
# Grav 2 only: everything lives under ICU.PLUGIN_GALINF (the namespace Admin
# Next and the api plugin look up first). Blueprints reference the keys
# WITHOUT the ICU. prefix (e.g. PLUGIN_GALINF.BATCH_SIZE).
# Any value can be overridden from Admin Next's translation editor
# (user/languages/en.yaml) without touching this file.
ICU:
  PLUGIN_GALINF:
    # ---------------------------------------------------------------- Options
    TAB_GENERAL: "General"
    SECTION_SOURCES: "Indexed content"
    TEMPLATES: "Indexed templates"
    TEMPLATES_HELP: "Page templates whose images are indexed (e.g. item). Nothing is indexed until this list or “Source pages/folders” is filled in. With source pages/folders set, leave empty to accept any template under them. After a change: run “Run all” (Maintenance tab)."
    ROOTS: "Source pages/folders"
    ROOTS_HELP: "Routes of pages or folders whose descendant pages are indexed (e.g. /blog; / for the whole site). Nothing is indexed until this list or “Indexed templates” is filled in. With templates set too, only the pages using them are taken. After a change: run “Run all” (Maintenance tab)."
    EXTENSIONS: "Included image extensions"
    EXTENSIONS_HELP: "Image formats included in the gallery (without the dot). GIF is included and animates in the gallery. SVG is not recommended (vector + security). After a change: run a reindex."

    TAB_GALLERY: "Gallery"
    SECTION_DISPLAY: "Display"
    BATCH_SIZE: "Batch size"
    BATCH_SIZE_HELP: "Number of images returned per request (infinite scroll)."
    SORT_FIELD: "Sort by"
    SORT_FIELD_HELP: "“Manual page order” follows the page tree order in the admin (folder names in natural order, numeric prefixes included — same as an `order: by: folder` collection); a drag-and-drop there is reflected in the gallery automatically. If the index was built with a version < 1.6.1: run a reindex once."
    SORT_FIELD_DATE: "Publication date"
    SORT_FIELD_FOLDER: "Manual page order (admin)"
    DEFAULT_SORT: "Initial order"
    DEFAULT_SORT_HELP: "Direction used when the gallery loads; visitors can change it if the sort control is shown."
    SORT_DESC: "Descending"
    SORT_ASC: "Ascending"
    SORT_RANDOM: "Random"
    SHOW_SORT_CONTROL: "Visitor “sort by” control"
    SHOW_SORT_CONTROL_HELP: "Shows the sort menu on the gallery page."
    TARGET_ROW_HEIGHT: "Target row height (px)"
    GAP: "Spacing between images (px)"
    SECTION_THUMBS: "Thumbnails"
    THUMB_WIDTH: "Thumbnail width (px)"
    THUMB_WIDTH_HELP: "Changing this value requires a full reindex."
    # Notices (`display` fields): HTML rendered as is, inline styles because
    # Tailwind colour utilities are purged from the admin2 bundle.
    THUMB_WIDTH_WARNING: '<div style="display:flex;gap:.6rem;align-items:flex-start;padding:.75rem .9rem;border:1px solid rgba(220,38,38,.45);border-left:4px solid #dc2626;border-radius:8px;background:rgba(220,38,38,.07);color:#dc2626;font-size:.875rem;line-height:1.5"><span aria-hidden="true">⚠️</span><span><strong>Heavy operation:</strong> changing the width means recreating <strong>every</strong> thumbnail — allow roughly 80 minutes for ~25,000 images — and leaves the old ones orphaned. After saving, run <strong>Run all</strong> in the Maintenance tab: it creates the new thumbnails, then purges the old ones.</span></div>'
    SECTION_EXCLUDE: "Hide an image with a tag"
    EXCLUDE_TAGS_INTRO: 'Add these tags to the <strong>Tags</strong> field of an image''s metadata (metadata edit button, in the page''s media) to remove it from a gallery without deleting it. The article is <strong>reindexed automatically</strong> when saved. Leaving a field empty disables that tag. These tags are never shown to visitors: they are stripped from the lightbox info panel.'
    EXCLUDE_TAGS_WARNING: '<div style="display:flex;gap:.6rem;align-items:flex-start;padding:.75rem .9rem;border:1px solid rgba(217,119,6,.45);border-left:4px solid #d97706;border-radius:8px;background:rgba(217,119,6,.07);color:#b45309;font-size:.875rem;line-height:1.5"><span aria-hidden="true">⚠️</span><span><strong>Changing a keyword below does not apply to images already indexed.</strong> Hiding is decided <em>at indexing time</em>: images hidden by the old keyword stay hidden, and the new one only takes effect on articles reindexed afterwards. After a change, run a <strong>reindex</strong> (Maintenance tab) — no need to clear the cache. Adding or removing a tag on an image, on the other hand, takes effect immediately.</span></div>'
    EXCLUDE_TAG_ARTICLE: "“Not in article gallery” tag"
    EXCLUDE_TAG_ARTICLE_HELP: "The image stays in the infinite gallery but disappears from its own article's gallery."
    EXCLUDE_TAG_GLOBAL: "“Not in infinite gallery” tag"
    EXCLUDE_TAG_GLOBAL_HELP: "The image stays in its article's gallery but disappears from the global gallery (in every sort order, “Commented” included)."
    SECTION_PERF: "Virtualization / performance"
    PRELOAD_MARGIN: "Preload margin (px)"
    PRELOAD_MARGIN_HELP: "Height rendered above/below the viewport. Higher = smoother but more DOM nodes."
    METADATA_LOOKAHEAD: "Metadata buffer (images ahead)"
    METADATA_LOOKAHEAD_HELP: "Number of images whose metadata (light JSON, not the files) is fetched ahead of scrolling — avoids hitting “Loading…” at the bottom of the page (End key, fast scrolling). 0 = progressively load the WHOLE index in the background."

    TAB_LIGHTBOX: "Lightbox"
    SECTION_BEHAVIOR: "Behavior"
    LOOP: "Loop at the end of the gallery"
    SHOW_INFO_SIDEBAR: "Info panel (sidebar)"
    SHOW_INFO_SIDEBAR_HELP: "Shows a side panel in the lightbox with the keys of the `image.jpg.meta.yaml` files (one block per key, CSS class `galinf-meta-<key>` the theme can style), read on demand through Grav's media API — a change to a .meta.yaml shows up immediately, without reindexing. The panel also hosts the comments. What it displays is set with the next two options."
    SIDEBAR_SHOW_META: "Show .meta.yaml info"
    SIDEBAR_SHOW_META_HELP: "Editorial keys of the `image.jpg.meta.yaml` files (title, description, prompt…) in the info panel."
    SIDEBAR_SHOW_EXIF: "Show EXIF data"
    SIDEBAR_SHOW_EXIF_HELP: "Technical EXIF keys found in the `.meta.yaml` files (camera, exposure, ISO, focal length…), whether they come from Grav's `media.auto_metadata_exif` option or another tool. Off by default: this data is often verbose, even binary."
    SIDEBAR_DEFAULT_OPEN: "Sidebar shown"
    SIDEBAR_DEFAULT_OPEN_HELP: "State of the info panel when the lightbox opens. If the “i” button (Buttons section below) is disabled, this state is ENFORCED — visitors cannot change it. Otherwise it is just a default: the visitor's choice is remembered in their browser and takes precedence."
    STRIP_DEFAULT_OPEN: "Thumbnail strip shown"
    STRIP_DEFAULT_OPEN_HELP: "State of the thumbnail strip. If its show/hide button (Buttons section below) is disabled, this state is ENFORCED — visitors cannot change it. Otherwise just a default: the visitor's choice is remembered and takes precedence."
    SECTION_BUTTONS: "Lightbox buttons"
    BTN_SLIDESHOW: "Slideshow"
    BTN_SLIDESHOW_HELP: "Play button + delay picker."
    BTN_ROTATE: "Rotate"
    BTN_DOWNLOAD: "Download"
    BTN_FULLSCREEN: "Fullscreen"
    BTN_STRIP: "Show/hide the strip"
    BTN_STRIP_HELP: "Disabled: the strip stays in the “Thumbnail strip shown” state chosen above, ENFORCED for every visitor."
    BTN_INFO: "Info panel (“i” button)"
    BTN_INFO_HELP: "Disabled: the panel stays in the “Sidebar shown” state chosen above, ENFORCED for every visitor (its close cross disappears too)."

    TAB_COMMENTS: "Comments"
    SECTION_SETTINGS: "Settings"
    COMMENTS_ENABLED: "Comments"
    COMMENTS_ENABLED_HELP: "Lets visitors comment on each image from the lightbox info panel. Flat-file storage through Flex Objects (one YAML file per comment under `user/data/galinf/comments/`); moderation happens in the admin's “Gallery comments” entry. The index only keeps a counter (badge on thumbnails, “Commented” sort). Requires the flex-objects plugin (shipped with Grav 2)."
    COMMENTS_WHO: "Who can comment"
    COMMENTS_WHO_ANONYMOUS: "Everyone (free nickname)"
    COMMENTS_WHO_MEMBERS: "Logged-in members"
    COMMENTS_WHO_ADMINS: "Administrators (logged in on the site)"
    COMMENTS_CAPTCHA: "Anti-bot check"
    COMMENTS_CAPTCHA_HELP: "Asked of visitors who are not logged in. Galinf question: a simple sum, nothing else needed. Cap: proof of work computed by the browser, no click, everything stays on this server. Cloudflare Turnstile and Google reCAPTCHA: their providers’ challenges; they send visitor data to Cloudflare or Google (mention it in your privacy policy). Cap, Turnstile and reCAPTCHA require the Form plugin and use its settings: the keys and the reCAPTCHA version are entered there. None: no check, only the hidden trap field and the limit of 5 comments per 10 minutes per IP address remain; bots then reach the moderation list (or the site, without pre-moderation). The Maintenance tab warns if the chosen check cannot work."
    COMMENTS_CAPTCHA_GALINF: "Galinf question (simple sum)"
    COMMENTS_CAPTCHA_CAP: "Cap (invisible proof of work, Form plugin)"
    COMMENTS_CAPTCHA_TURNSTILE: "Cloudflare Turnstile (Form plugin + keys)"
    COMMENTS_CAPTCHA_RECAPTCHA: "Google reCAPTCHA (Form plugin + keys)"
    COMMENTS_CAPTCHA_NONE: "None (trap field and rate limit only)"
    COMMENTS_DAILY_MAX: "Comments per day (whole site)"
    COMMENTS_DAILY_MAX_HELP: "Beyond this number, the site refuses new comments until the next day (server date). Stops a flood of bots coming from many addresses, which the limit of 5 comments per 10 minutes per address does not. Moderators are not counted."
    COMMENTS_DAILY_UNLIMITED: "Unlimited per day"
    COMMENTS_DAILY_UNLIMITED_HELP: "Lifts the daily cap above. The limit of 5 comments per 10 minutes per address still applies."
    COMMENTS_REQUIRE_NAME: "Nickname required"
    COMMENTS_REQUIRE_NAME_HELP: "For anonymous visitors: require a nickname (otherwise “Anon”)."
    COMMENTS_MAX_LENGTH: "Maximum comment length"
    COMMENTS_MAX_LENGTH_HELP: "In characters, from 50 to 1000. Applies to visitors; in the admin, existing comments can still be edited up to 2000 characters."
    COMMENTS_COUNTER_ALWAYS: "Counter always visible"
    COMMENTS_COUNTER_ALWAYS_HELP: "Shows the “characters left” counter as soon as the form opens. Disabled: it only appears once less than 20 % of the limit is left."
    COMMENTS_MODERATION: "Pre-moderation"
    COMMENTS_MODERATION_HELP: "Comments only appear once approved by an administrator — in the admin's “Gallery comments” entry (Approved column in the list, approval through the edit form). Disabled: published immediately, deleted afterwards if needed."

    MAINTENANCE: "Maintenance"
    REINDEX_ACTION: "Gallery index"
    REINDEX_ACTION_HELP: "Upkeep of the index and thumbnails. The index updates itself when an article is saved or an image is added from the admin: these actions are for after an import outside the admin, a settings change, or to tidy up. (Thumbnails are persistent: a Grav update or a “Clear all” of the cache does not destroy them.)"
    UNINSTALL_ACTION: "Uninstall"
    UNINSTALL_ACTION_HELP: "Removing the plugin does not delete what it created on the server, so that reinstalling loses nothing. To get back to a clean site, delete its data here just before uninstalling it."

    # ------------------------------------------- Maintenance tab (custom fields)
    # Read by the Admin Next web components through window.__GRAV_I18N.t(),
    # which formats ICU messages. Avoid the straight apostrophe ' right before
    # { or # (ICU escape character); use ’ instead. No HTML tags either: the
    # formatter rejects them — markup is passed in as {count}, {warning}…
    MAINT:
      SCOPE_EMPTY_TITLE: "No page is selected yet."
      SCOPE_EMPTY_TEXT: "Nothing will be indexed until you choose which pages to use (“Indexed templates” and/or “Source pages/folders”, General tab). Save, then run “Run all” below."
      CAPTCHA_ISSUE_TITLE: "Visitors cannot post comments."
      # CAPTCHA_ISSUE_<code returned by the stats, upper-cased>.
      CAPTCHA_ISSUE_FORM_MISSING: "The anti-bot check chosen in the Comments tab (Cap, Turnstile or reCAPTCHA) relies on the Form plugin, which is missing, disabled or too old. Enable the Form plugin, or choose the Galinf question."
      CAPTCHA_ISSUE_TURNSTILE_KEYS: "Cloudflare Turnstile is chosen as the anti-bot check (Comments tab), but its site key and secret key are not set in the Form plugin’s settings."
      CAPTCHA_ISSUE_RECAPTCHA_KEYS: "Google reCAPTCHA is chosen as the anti-bot check (Comments tab), but its site key and secret key are not set in the Form plugin’s settings."
      GROUP_ROUTINE: "Routine upkeep"
      GROUP_REBUILD: "Rebuild"
      KIND_HEAVY: "Heavy operation"
      KIND_DELETE: "Permanent deletion"
      ACT_ALL: "Run all"
      ACT_ALL_DESC: "Updates the index, creates missing thumbnails, then purges orphan thumbnails. Routine upkeep in one click, including after a thumbnail width change."
      ACT_INDEX: "Update the index"
      ACT_INDEX_DESC: "Rereads every article without creating any thumbnail. After changing a hiding keyword or the folder order. An image without a thumbnail temporarily serves the original."
      ACT_MISSING: "Create missing thumbnails"
      ACT_MISSING_DESC: "Updates the index and creates the missing thumbnails. After an import or an FTP upload of images."
      ACT_FORCE: "Regenerate all thumbnails"
      ACT_FORCE_DESC: "Recreates every thumbnail, even existing ones. This is the longest operation."
      ACT_FORCE_CONFIRM: "Every thumbnail will be recreated, even those that exist."
      ACT_SCRATCH: "Rebuild from scratch"
      ACT_SCRATCH_DESC: "Empties the index, then rebuilds it. Keep this for an inconsistent index."
      ACT_SCRATCH_CONFIRM: "The index is emptied right away: the gallery stays incomplete until the operation has run to the end. If you stop it, run it again."
      ACT_PURGE: "Purge orphan thumbnails"
      ACT_PURGE_DESC: "Deletes thumbnails of images that are no longer in the index, to free up space."
      ACT_PURGE_CONFIRM: "Thumbnails that no longer match any image in the index will be permanently deleted."
      CONFIRM_TITLE: "{action}?"
      CLOSE: "Close"
      SEP: "; "
      SIZE_UNITS: "B,KB,MB,GB"
      STATS_UNAVAILABLE: "Statistics unavailable"
      NEVER: "never"
      TILE_INDEXED: "{n, plural, one{image indexed} other{images indexed}}"
      TILE_LAST: "last indexing"
      TILE_MISSING: "{n, plural, one{image without thumbnail} other{images without thumbnail}}"
      LAST_RUN: "Last run: {when} — {duration} for {what}."
      LAST_RUN_INDEX: "{images, plural, one{# image} other{# images}}, {thumbs, plural, one{# thumbnail created} other{# thumbnails created}}"
      LAST_RUN_PURGE: "{n, plural, one{# thumbnail deleted} other{# thumbnails deleted}}, {size} freed"
      NEVER_RUN: "Never run here."
      EST_INDEX: "Never run here. Estimate on a Raspberry Pi 5: about 3 s per 1,000 images."
      EST_FORCE: "Never run here. Estimate on a Raspberry Pi 5: about 3 min per 1,000 images."
      EST_MISSING: "Never run here. Estimate on a Raspberry Pi 5: about 3 s per 1,000 images, plus 3 min per 1,000 thumbnails to create."
      DURATION_UNDER_1S: "less than a second"
      JOB_STARTING: "Starting…"
      JOB_ARTICLE: "Article {n} of {total}"
      JOB_PURGING: "Purging orphan thumbnails…"
      JOB_FOLDER: "Folder {n} of {total}"
      JOB_STOPPING_FOLDER: "Stopping after the current folder…"
      JOB_PROGRESS: "{images, plural, one{# image processed} other{# images processed}}, {thumbs, plural, one{# thumbnail created} other{# thumbnails created}}"
      JOB_REMAINING: "About {duration} left."
      JOB_KEEP_OPEN: "Do not close this page."
      JOB_STOP: "Stop"
      JOB_STOPPING: "Stopping after the current article…"
      PART_ARTICLES: "{articles, plural, one{# article} other{# articles}}, {images, plural, one{# image} other{# images}}"
      PART_THUMBS: "{n, plural, one{# thumbnail created} other{# thumbnails created}}"
