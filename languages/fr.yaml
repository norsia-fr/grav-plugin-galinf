# galinf plugin strings — French.
# Grav 2 only: everything lives under ICU.PLUGIN_GALINF (the namespace Admin
# Next and the api plugin look up first). Blueprints reference the keys
# WITHOUT the ICU. prefix (e.g. PLUGIN_GALINF.BATCH_SIZE).
# Any value can be overridden from Admin Next's translation editor
# (user/languages/fr.yaml) without touching this file.
ICU:
  PLUGIN_GALINF:
    # ---------------------------------------------------------------- Options
    TAB_GENERAL: "Général"
    SECTION_SOURCES: "Contenu indexé"
    TEMPLATES: "Templates indexés"
    TEMPLATES_HELP: "Templates de page dont les images sont indexées (ex. item). Rien n'est indexé tant que cette liste ou « Pages/dossiers sources » n'est pas remplie. Avec des pages/dossiers sources, laisser vide pour accepter tout template sous ces racines. Après modification : lancer « Tout faire » (onglet Maintenance)."
    ROOTS: "Pages/dossiers sources"
    ROOTS_HELP: "Routes de pages ou dossiers dont les pages descendantes sont indexées (ex. /blog ; / pour tout le site). Rien n'est indexé tant que cette liste ou « Templates indexés » n'est pas remplie. Si des templates sont aussi choisis, seules les pages qui les utilisent sont prises. Après modification : lancer « Tout faire » (onglet Maintenance)."
    EXTENSIONS: "Extensions d'images incluses"
    EXTENSIONS_HELP: "Formats d'images inclus dans la galerie (sans le point). Le gif est inclus et s'animera dans la galerie. Le SVG est déconseillé (vectoriel + sécurité). Après modification : relancer la réindexation."

    TAB_GALLERY: "Galerie"
    SECTION_DISPLAY: "Affichage"
    BATCH_SIZE: "Taille de lot"
    BATCH_SIZE_HELP: "Nombre d'images renvoyées par requête (infinite scroll)."
    SORT_FIELD: "Critère de tri"
    SORT_FIELD_HELP: "« Ordre manuel des pages » suit l'ordre de l'arborescence dans l'admin (noms de dossiers en tri naturel, préfixes numériques compris — identique à une collection `order: by: folder`) ; un glisser-déposer y est répercuté automatiquement dans la galerie. Si l'index a été construit avec une version < 1.6.1 : relancer une réindexation une fois."
    SORT_FIELD_DATE: "Date de publication"
    SORT_FIELD_FOLDER: "Ordre manuel des pages (admin)"
    DEFAULT_SORT: "Ordre initial"
    DEFAULT_SORT_HELP: "Sens de parcours au chargement de la galerie ; le visiteur peut en changer si le contrôle de tri est affiché."
    SORT_DESC: "Descendant"
    SORT_ASC: "Ascendant"
    SORT_RANDOM: "Aléatoire"
    SHOW_SORT_CONTROL: "Contrôle « trier par » visiteur"
    SHOW_SORT_CONTROL_HELP: "Affiche le menu de tri sur la page galerie."
    TARGET_ROW_HEIGHT: "Hauteur cible des lignes (px)"
    GAP: "Espacement entre images (px)"
    SECTION_THUMBS: "Vignettes"
    THUMB_WIDTH: "Largeur des vignettes (px)"
    THUMB_WIDTH_HELP: "Modifier cette valeur impose une réindexation complète."
    # Notices (`display` fields): HTML rendered as is, inline styles because
    # Tailwind colour utilities are purged from the admin2 bundle.
    THUMB_WIDTH_WARNING: '<div style="display:flex;gap:.6rem;align-items:flex-start;padding:.75rem .9rem;border:1px solid rgba(220,38,38,.45);border-left:4px solid #dc2626;border-radius:8px;background:rgba(220,38,38,.07);color:#dc2626;font-size:.875rem;line-height:1.5"><span aria-hidden="true">⚠️</span><span><strong>Opération lourde :</strong> changer la largeur impose de recréer <strong>toutes</strong> les vignettes — comptez de l''ordre de 80 minutes pour ~25&nbsp;000 images — et rend les anciennes orphelines. Après enregistrement, lancez <strong>Tout faire</strong> dans l''onglet Maintenance : il crée les nouvelles vignettes puis purge les anciennes.</span></div>'
    SECTION_EXCLUDE: "Masquer une image par tag"
    EXCLUDE_TAGS_INTRO: 'Posez ces tags dans le champ <strong>Tags</strong> des métadonnées d''une image (bouton d''édition des métadonnées, dans les médias de la page) pour la retirer d''une galerie sans la supprimer. L''article concerné est <strong>réindexé automatiquement</strong> à l''enregistrement. Laisser un champ vide désactive le tag correspondant. Ces tags ne sont jamais montrés aux visiteurs : ils sont retirés du panneau d''infos de la lightbox.'
    EXCLUDE_TAGS_WARNING: '<div style="display:flex;gap:.6rem;align-items:flex-start;padding:.75rem .9rem;border:1px solid rgba(217,119,6,.45);border-left:4px solid #d97706;border-radius:8px;background:rgba(217,119,6,.07);color:#b45309;font-size:.875rem;line-height:1.5"><span aria-hidden="true">⚠️</span><span><strong>Changer un mot-clé ci-dessous ne s''applique pas aux images déjà indexées.</strong> Le masquage est calculé <em>au moment de l''indexation</em> : les images masquées par l''ancien mot-clé le restent, et le nouveau ne prend effet que sur les articles réindexés ensuite. Après modification, lancez une <strong>réindexation</strong> (onglet Maintenance) — inutile de vider le cache. Poser ou retirer un tag sur une image, en revanche, est pris en compte immédiatement.</span></div>'
    EXCLUDE_TAG_ARTICLE: "Tag « hors galerie d'article »"
    EXCLUDE_TAG_ARTICLE_HELP: "L'image reste dans la galerie infinie, mais disparaît de la galerie de son propre article."
    EXCLUDE_TAG_GLOBAL: "Tag « hors galerie infinie »"
    EXCLUDE_TAG_GLOBAL_HELP: "L'image reste dans la galerie de son article, mais disparaît de la galerie globale (tous tris confondus, y compris « Commentées »)."
    SECTION_PERF: "Virtualisation / performances"
    PRELOAD_MARGIN: "Marge de pré-chargement (px)"
    PRELOAD_MARGIN_HELP: "Hauteur rendue au-dessus/dessous du viewport. Plus haut = plus fluide mais plus de nœuds DOM."
    METADATA_LOOKAHEAD: "Tampon de métadonnées (images d'avance)"
    METADATA_LOOKAHEAD_HELP: "Nombre d'images dont les métadonnées (JSON léger, pas les fichiers) sont pré-chargées en avance du scroll — évite de buter sur « Chargement… » en bas de page (touche Fin, scroll rapide). 0 = charger progressivement TOUT l'index en arrière-plan."

    TAB_LIGHTBOX: "Lightbox"
    SECTION_BEHAVIOR: "Comportement"
    LOOP: "Boucler en fin de galerie"
    SHOW_INFO_SIDEBAR: "Panneau d'infos (sidebar)"
    SHOW_INFO_SIDEBAR_HELP: "Affiche dans la lightbox un panneau latéral avec les clés des fichiers `image.jpg.meta.yaml` (un bloc par clé, classe CSS `galinf-meta-<clé>` stylable par le thème), lues à la demande via l'API média de Grav — une modification d'un .meta.yaml est visible immédiatement, sans réindexation. Le panneau accueille aussi les commentaires. Le contenu affiché se règle avec les deux options suivantes."
    SIDEBAR_SHOW_META: "Afficher les infos des .meta.yaml"
    SIDEBAR_SHOW_META_HELP: "Clés éditoriales des fichiers `image.jpg.meta.yaml` (titre, description, prompt…) dans le panneau d'infos."
    SIDEBAR_SHOW_EXIF: "Afficher les données EXIF"
    SIDEBAR_SHOW_EXIF_HELP: "Clés techniques EXIF présentes dans les `.meta.yaml` (appareil, exposition, ISO, focale…), qu'elles viennent de l'option `media.auto_metadata_exif` de Grav ou d'un autre outil. Désactivé par défaut : ces données sont souvent verbeuses, voire binaires."
    SIDEBAR_DEFAULT_OPEN: "Sidebar affichée"
    SIDEBAR_DEFAULT_OPEN_HELP: "État du panneau d'infos à l'ouverture de la lightbox. Si le bouton « i » (section Boutons ci-dessous) est désactivé, cet état est FORCÉ — le visiteur ne peut pas en changer. Sinon, c'est un simple défaut : le choix du visiteur est mémorisé dans son navigateur et prend le dessus."
    STRIP_DEFAULT_OPEN: "Ruban de miniatures affiché"
    STRIP_DEFAULT_OPEN_HELP: "État du bandeau de miniatures. Si son bouton afficher/masquer (section Boutons ci-dessous) est désactivé, cet état est FORCÉ — le visiteur ne peut pas en changer. Sinon, simple défaut : le choix du visiteur est mémorisé et prend le dessus."
    SECTION_BUTTONS: "Boutons de la lightbox"
    BTN_SLIDESHOW: "Diaporama"
    BTN_SLIDESHOW_HELP: "Bouton lecture + choix du délai."
    BTN_ROTATE: "Rotation"
    BTN_DOWNLOAD: "Téléchargement"
    BTN_FULLSCREEN: "Plein écran"
    BTN_STRIP: "Afficher/masquer le ruban"
    BTN_STRIP_HELP: "Désactivé : le ruban reste dans l'état « Ruban de miniatures affiché » choisi plus haut, FORCÉ pour tous les visiteurs."
    BTN_INFO: "Panneau d'infos (bouton « i »)"
    BTN_INFO_HELP: "Désactivé : le panneau reste dans l'état « Sidebar affichée » choisi plus haut, FORCÉ pour tous les visiteurs (sa croix de fermeture disparaît aussi)."

    TAB_COMMENTS: "Commentaires"
    SECTION_SETTINGS: "Réglages"
    COMMENTS_ENABLED: "Commentaires"
    COMMENTS_ENABLED_HELP: "Permet de commenter chaque image depuis le panneau d'infos de la lightbox. Stockage flat-file via Flex Objects (un fichier YAML par commentaire sous `user/data/galinf/comments/`) ; la modération se fait dans l'entrée « Commentaires galerie » de l'admin. L'index n'en garde qu'un compteur (badge sur les miniatures, tri « Commentées »). Nécessite le plugin flex-objects (livré avec Grav 2)."
    COMMENTS_WHO: "Qui peut commenter"
    COMMENTS_WHO_ANONYMOUS: "Tout le monde (pseudo libre)"
    COMMENTS_WHO_MEMBERS: "Membres connectés"
    COMMENTS_WHO_ADMINS: "Administrateurs (connectés sur le site)"
    COMMENTS_CAPTCHA: "Vérification anti-robot"
    COMMENTS_CAPTCHA_HELP: "Demandée aux visiteurs non connectés. Question Galinf : une addition simple, rien d’autre à installer. Cap : preuve de travail calculée par le navigateur, sans clic, tout reste sur ce serveur. Cloudflare Turnstile et Google reCAPTCHA : les défis de ces fournisseurs ; ils envoient des données des visiteurs à Cloudflare ou à Google (à mentionner dans votre politique de confidentialité). Cap, Turnstile et reCAPTCHA nécessitent le plugin Form et utilisent ses réglages : les clés et la version de reCAPTCHA se saisissent là. Aucune : pas de vérification, seuls restent le champ piège invisible et la limite de 5 commentaires par 10 minutes par adresse IP ; les robots arrivent alors dans la liste de modération (ou sur le site, sans pré-modération). L’onglet Maintenance prévient si la vérification choisie ne peut pas fonctionner."
    COMMENTS_CAPTCHA_GALINF: "Question Galinf (addition simple)"
    COMMENTS_CAPTCHA_CAP: "Cap (preuve de travail invisible, plugin Form)"
    COMMENTS_CAPTCHA_TURNSTILE: "Cloudflare Turnstile (plugin Form + clés)"
    COMMENTS_CAPTCHA_RECAPTCHA: "Google reCAPTCHA (plugin Form + clés)"
    COMMENTS_CAPTCHA_NONE: "Aucune (champ piège et limite de débit seulement)"
    COMMENTS_DAILY_MAX: "Commentaires par jour (tout le site)"
    COMMENTS_DAILY_MAX_HELP: "Au-delà de ce nombre, le site refuse les nouveaux commentaires jusqu’au lendemain (date du serveur). Arrête un afflux de robots venant de nombreuses adresses, ce que ne fait pas la limite de 5 commentaires par 10 minutes par adresse. Les modérateurs ne sont pas comptés."
    COMMENTS_DAILY_UNLIMITED: "Illimité par jour"
    COMMENTS_DAILY_UNLIMITED_HELP: "Lève le plafond quotidien ci-dessus. La limite de 5 commentaires par 10 minutes par adresse s’applique toujours."
    COMMENTS_REQUIRE_NAME: "Pseudo obligatoire"
    COMMENTS_REQUIRE_NAME_HELP: "Pour les visiteurs anonymes : exiger un pseudo (sinon « Anon »)."
    COMMENTS_MAX_LENGTH: "Longueur maximale d’un commentaire"
    COMMENTS_MAX_LENGTH_HELP: "En caractères, de 50 à 1000. S’applique aux visiteurs ; dans l’admin, les commentaires existants restent modifiables jusqu’à 2000 caractères."
    COMMENTS_COUNTER_ALWAYS: "Compteur toujours visible"
    COMMENTS_COUNTER_ALWAYS_HELP: "Affiche le compteur de caractères restants dès l’ouverture du formulaire. Désactivé : il n’apparaît que lorsqu’il reste moins de 20 % de la limite."
    COMMENTS_MODERATION: "Pré-modération"
    COMMENTS_MODERATION_HELP: "Les commentaires n'apparaissent qu'après approbation par un administrateur — dans l'entrée « Commentaires galerie » de l'admin (colonne Approuvé en liste, approbation via le formulaire d'édition). Désactivé : publication immédiate, suppression a posteriori."

    MAINTENANCE: "Maintenance"
    REINDEX_ACTION: "Index de la galerie"
    REINDEX_ACTION_HELP: "Entretien de l'index et des vignettes. L'index se met à jour tout seul quand un article est enregistré ou qu'une image est ajoutée depuis l'admin : ces actions servent après un import hors-admin, un changement de réglage, ou pour faire le ménage. (Les vignettes sont persistantes : une mise à jour de Grav ou un « Tout vider » du cache ne les détruit pas.)"
    UNINSTALL_ACTION: "Désinstallation"
    UNINSTALL_ACTION_HELP: "Retirer le plugin ne supprime pas ce qu'il a créé sur le serveur, pour qu'une réinstallation ne fasse rien perdre. Pour repartir d'un site propre, supprimez ses données ici juste avant de le désinstaller."

